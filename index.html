      align-items: center;
      gap: 6px;
      margin: 0 auto;
      transition: transform 0.15s, box-shadow 0.15s;

    .link-tile-btn:hover {

    .link-tile-btn label {

      font-weight: bold;
      color: #111;

    }

    /* 録音中パルスアニメーション */
    .recording-active {
      background-color: #ff4757 !important;
      color: #fff !important;
      animation: mic-pulse 1.2s infinite;
    }
    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(255, 71, 87, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }

    table.dataframe {
      border-collapse: collapse;
      margin: 15px auto;
      background: #ffffff;
      border: 1px solid #999;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      max-width: 1000px;
    }
    table.dataframe th, table.dataframe td {
      border: 1px solid #ccc;
      padding: 6px 12px;
      text-align: center;
    }
    table.dataframe th {
      background: #f0f4f8;
      font-weight: bold;
      color: #333;
    }
    table.dataframe tr:nth-child(even) td {
      background: #fbfbfb;
    }
    table.dataframe tr:hover td {
      background: #e6f7ff;

      background: none;
      cursor: pointer;

      border-radius: 8px;

    // 音声読み上げ (当時: Azure Speech -> 最新: Web Speech API TTS)
    function synthesizeSpeech() {
      if (!('speechSynthesis' in window)) {
        alert('お使いのブラウザは音声合成に対応していません。');
        return;
      }
      window.speechSynthesis.cancel();
      const text = document.getElementById('question').value;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
      showToast('🔊 質問を読み上げています (Web Speech API)');
    }

    // 音声認識 (当時: Azure Speech -> 最新: Web Speech API STT)
    function toggleSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('お使いのブラウザはWeb Speech Recognitionに対応していません。Google ChromeまたはEdgeを推奨します。');
        return;
      }

      const btn = document.getElementById('btnRecordMic');
      const statusText = document.getElementById('micStatusText');
      const ansField = document.getElementById('ans');
      const timeSec = parseInt(document.getElementById('timeSec').value, 10) || 5;

      if (isRecordingVoice) {
        if (currentSpeechRecognizer) currentSpeechRecognizer.stop();
        return;
      }

      currentSpeechRecognizer = new SpeechRec();
      currentSpeechRecognizer.lang = 'ja-JP';
      currentSpeechRecognizer.continuous = true;
      currentSpeechRecognizer.interimResults = true;

      let finalTranscript = ansField.value ? ansField.value + ' ' : '';

      currentSpeechRecognizer.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        ansField.value = finalTranscript + interim;
      };

      currentSpeechRecognizer.onerror = (e) => {
        console.error('Speech error', e);
        stopRecordingUI();
      };

      currentSpeechRecognizer.onend = () => {
        stopRecordingUI();
      };

      try {
        currentSpeechRecognizer.start();
        isRecordingVoice = true;
        btn.classList.add('recording-active');
        btn.textContent = '🛑 音声認識を停止';
        statusText.style.display = 'block';

        // タイマー秒数で自動停止
        setTimeout(() => {
          if (isRecordingVoice && currentSpeechRecognizer) {
            currentSpeechRecognizer.stop();
          }
        }, timeSec * 1000);
      } catch (err) {
        console.error(err);
      }

      function stopRecordingUI() {
        isRecordingVoice = false;
        btn.classList.remove('recording-active');
        btn.textContent = '🎙️ 録音開始';
        statusText.style.display = 'none';
        showToast('回答を音声入力しました');
      }
    }

    function updateAttendCalculations() {
      const select = document.getElementById('attendNumSelect');
      if (!select) return;
      const attendNum = parseInt(select.value, 10);
      const student = CT4_STUDENTS.find(s => s.num === attendNum) || CT4_STUDENTS[0];

      // 11月のチャンピオン
      const champion = [...CT4_STUDENTS].sort((a, b) => b.m11 - a.m11)[0];

      // 統計量
      const n = CT4_STUDENTS.length;
      const values11 = CT4_STUDENTS.map(s => s.m11);
      const mean = values11.reduce((sum, v) => sum + v, 0) / n;
      const variance = values11.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / (n - 1);
      const std = Math.sqrt(variance) || 1;

      // 偏差値計算: (attendValue - mean) / std * 10 + 50
      const hensachi = ((student.m11 - mean) / std * 10) + 50;

      // 当時の attend.html そのままの表示形式: 出席番号{{ 出席番号 }}の偏差値:{{ 偏差値 }}
      document.getElementById('attendHensachiDisplay').innerText = `出席番号${student.studentId}の偏差値:${hensachi.toFixed(2)}`;

      // 1. 折れ線グラフ (utils1)
      const ctxLine = document.getElementById('attendChartLine');
      if (ctxLine) {
        if (currentAttendChartLine) currentAttendChartLine.destroy();
        const t_list = ['4月', '5月', '6月', '7月', '9月', '10月', '11月'];
        const x_list = [student.m4, student.m5, student.m6, student.m7, student.m9, student.m10, student.m11];
        const twobar = [champion.m4, champion.m5, champion.m6, champion.m7, champion.m9, champion.m10, champion.m11];

        currentAttendChartLine = new Chart(ctxLine.getContext('2d'), {
          type: 'line',
          data: {
            labels: t_list,
            datasets: [
              {
                label: `出席番号${student.studentId}`,
                data: x_list,
                borderColor: '#1f77b4',
                backgroundColor: 'rgba(31, 119, 180, 0.1)',
                borderWidth: 2,
                pointRadius: 4,
                tension: 0.1
              },
              {
                label: '11月のチャンピオン',
                data: twobar,
                borderColor: '#ff7f0e',
                borderWidth: 2,
                pointRadius: 4,
                tension: 0.1
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: {
                display: true,
                text: `出席番号${student.studentId}の年間累計欠席日数と欠席リミット比率`
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: '日数' }
              },
              x: {
                title: { display: true, text: '日付' }
              }
            }
          }
        });
      }

      // 2. 円グラフ (utils1)
      const ctxPie = document.getElementById('attendChartPie');
      if (ctxPie) {
        if (currentAttendChartPie) currentAttendChartPie.destroy();
        const m4_only = student.m4;
        const m5_only = Math.max(0, parseFloat((student.m5 - student.m4).toFixed(2)));
        const m6_only = Math.max(0, parseFloat((student.m6 - student.m5).toFixed(2)));
        const m7_only = Math.max(0, parseFloat((student.m7 - student.m6).toFixed(2)));
        const m9_only = Math.max(0, parseFloat((student.m9 - student.m7).toFixed(2)));
        const m10_only = Math.max(0, parseFloat((student.m10 - student.m9).toFixed(2)));
        const m11_only = Math.max(0, parseFloat((student.m11 - student.m10).toFixed(2)));
        const remainDays = Math.max(0, parseFloat((LIMIT_DAYS - student.m11).toFixed(2)));

        const pieLabels = [
          '4月', '5月', '6月', '7月', '9月', '10月', '11月',
          `残り日数:${remainDays}日`
        ];
        const pieData = [m4_only, m5_only, m6_only, m7_only, m9_only, m10_only, m11_only, remainDays];

        currentAttendChartPie = new Chart(ctxPie.getContext('2d'), {
          type: 'pie',
          data: {
            labels: pieLabels,
            datasets: [{
              data: pieData,
              backgroundColor: [
                '#4e79a7', '#f28e2c', '#e15759', '#76b7b2', '#59a14f', '#edc949', '#af7aa1', '#9c755f'
              ],
              offset: [0, 0, 0, 0, 0, 0, 0, 10]
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: {
                display: true,
                text: '欠席の内訳'
              },
              legend: {
                position: 'right',
                labels: { boxWidth: 12, font: { size: 10 } }
              }
            }
          }
        });
      }

      // 3. 散布図 (utils2)
      const ctxScatter = document.getElementById('attendChartScatter');
      if (ctxScatter) {
        if (currentAttendChartScatter) currentAttendChartScatter.destroy();
        const scatterData = CT4_STUDENTS.map(s => ({ x: s.num, y: s.m11 }));

        currentAttendChartScatter = new Chart(ctxScatter.getContext('2d'), {
          type: 'scatter',
          data: {
            datasets: [{
              label: '11月年間累計欠席換算',
              data: scatterData,
              backgroundColor: '#1f77b4',
              pointRadius: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: { display: true, text: '散布図' }
            },
            scales: {
              x: {
                title: { display: true, text: '出席番号' },
                min: 0,
                max: 60
              },
              y: {
                title: { display: true, text: '人数' },
                beginAtZero: true
              }
            }
          }
        });
      }

      // 4. ヒストグラム (utils2)
      const ctxHist = document.getElementById('attendChartHist');
      if (ctxHist) {
        if (currentAttendChartHist) currentAttendChartHist.destroy();
        const bins = [0, 5, 10, 15, 20, 25, 30, 35];
        const binLabels = ['0-5', '5-10', '10-15', '15-20', '20-25', '25-30', '30-35'];
        const binCounts = new Array(binLabels.length).fill(0);

        CT4_STUDENTS.forEach(s => {
          for (let i = 0; i < bins.length - 1; i++) {
            const isLast = i === bins.length - 2;
            if (s.m11 >= bins[i] && (isLast ? s.m11 <= bins[i+1] : s.m11 < bins[i+1])) {
              binCounts[i]++;
              break;
            }
          }
        });

        currentAttendChartHist = new Chart(ctxHist.getContext('2d'), {
          type: 'bar',
          data: {
            labels: binLabels,
            datasets: [{
              label: '頻度',
              data: binCounts,
              backgroundColor: '#1f77b4'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: { display: true, text: 'ヒストグラム' }
            },
            scales: {
              x: { title: { display: true, text: '欠席日数' } },
              y: { beginAtZero: true }
            }
          }
        });
      }

      // 5. 全員棒グラフ (utils2)
      const ctxAllBar = document.getElementById('attendChartAllBar');
      if (ctxAllBar) {
        if (currentAttendChartAllBar) currentAttendChartAllBar.destroy();
        const barLabels = CT4_STUDENTS.map(s => s.num);
        const barData = CT4_STUDENTS.map(s => s.m11);

        currentAttendChartAllBar = new Chart(ctxAllBar.getContext('2d'), {
          type: 'bar',
          data: {
            labels: barLabels,
            datasets: [{
              label: '11月年間累計欠席換算',
              data: barData,
              backgroundColor: '#1f77b4'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                title: { display: true, text: '出席番号' },
                ticks: { font: { size: 9 } }
              },
              y: {
                title: { display: true, text: '欠席日数' },
                beginAtZero: true
              }
            }
          }
        });
      }

      // 6. describe テーブル (当時の x_list2.describe().to_html 完全再現)
      const sortedVals = [...values11].sort((a, b) => a - b);
      function quantile(arr, q) {
        const pos = (arr.length - 1) * q;
        const base = Math.floor(pos);
        const rest = pos - base;
        if (arr[base + 1] !== undefined) {
          return arr[base] + rest * (arr[base + 1] - arr[base]);
        }
        return arr[base];
      }

      const qMin = sortedVals[0];
      const q25 = quantile(sortedVals, 0.25);
      const q50 = quantile(sortedVals, 0.50);
      const q75 = quantile(sortedVals, 0.75);
      const qMax = sortedVals[sortedVals.length - 1];

      document.getElementById('attendDescribeContainer').innerHTML = `
        <table class="dataframe" style="border: 1px solid #ccc; border-collapse: collapse; margin: 0 auto; text-align: right; font-family: monospace; white-space: nowrap;">
          <thead>
            <tr style="text-align: right; background: #f0f0f0;">
              <th style="padding: 4px 8px; border: 1px solid #ccc;"></th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">11月年間累計欠席換算</th>
            </tr>
          </thead>
          <tbody>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">count</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${n.toFixed(6)}</td></tr>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">mean</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${mean.toFixed(6)}</td></tr>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">std</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${std.toFixed(6)}</td></tr>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">min</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${qMin.toFixed(6)}</td></tr>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">25%</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${q25.toFixed(6)}</td></tr>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">50%</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${q50.toFixed(6)}</td></tr>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">75%</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${q75.toFixed(6)}</td></tr>
            <tr><th style="padding: 4px 8px; border: 1px solid #ccc; text-align: left;">max</th><td style="padding: 4px 8px; border: 1px solid #ccc;">${qMax.toFixed(6)}</td></tr>
          </tbody>
        </table>
      `;

      // 7. allcsv テーブル (当時の dfchamponly.to_html(na_rep='') 完全再現)
      const sortedByChamp = [...CT4_STUDENTS].sort((a, b) => b.m11 - a.m11);

      document.getElementById('attendAllCsvContainer').innerHTML = `
        <table class="dataframe" style="border: 1px solid #ccc; border-collapse: collapse; margin: 0 auto; text-align: right; font-size: 13px; white-space: nowrap;">
          <thead>
            <tr style="text-align: right; background: #f0f0f0;">
              <th style="padding: 4px 8px; border: 1px solid #ccc;">出席番号</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">学籍番号</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">4月年間累計欠席換算</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">5月年間累計欠席換算</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">6月年間累計欠席換算</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">7月年間累計欠席換算</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">9月年間累計欠席換算</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">10月年間累計欠席換算</th>
              <th style="padding: 4px 8px; border: 1px solid #ccc;">11月年間累計欠席換算</th>
            </tr>
          </thead>
          <tbody>
            ${sortedByChamp.map(s => `
              <tr>
                <th style="padding: 4px 8px; border: 1px solid #ccc; text-align: center;">${s.num}</th>
                <td style="padding: 4px 8px; border: 1px solid #ccc; text-align: center; font-family: monospace;">${escapeHtml(s.studentId)}</td>
                <td style="padding: 4px 8px; border: 1px solid #ccc;">${s.m4}</td>
                <td style="padding: 4px 8px; border: 1px solid #ccc;">${s.m5}</td>
                <td style="padding: 4px 8px; border: 1px solid #ccc;">${s.m6}</td>
                <td style="padding: 4px 8px; border: 1px solid #ccc;">${s.m7}</td>
                <td style="padding: 4px 8px; border: 1px solid #ccc;">${s.m9}</td>
                <td style="padding: 4px 8px; border: 1px solid #ccc;">${s.m10}</td>
                <td style="padding: 4px 8px; border: 1px solid #ccc;">${s.m11}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function downloadCurrentDbCsv(e) {
      e.preventDefault();
      const db = getDB();
      const headers = ['id', 'Question', 'Answer', 'Memo', 'FB', 'Contributor', 'WhoAnswers', 'FBer', 'Genre', 'AnswerReq', 'FBReq'];
      const csvRows = [headers.join(',')];

      db.forEach(row => {
        const line = headers.map(h => {
          const val = row[h] !== undefined ? String(row[h]) : '';
          return `"${val.replace(/"/g, '""')}"`;
        }).join(',');
        csvRows.push(line);
      });

      const blob = new Blob([csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mensetu_database.csv';
      a.click();
      showToast('質問データベースCSVをダウンロードしました');
    }

    function uploadCsvFile() {
      const fileInput = document.getElementById('csvFileInput');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('CSVファイルを選択してください。');
        return;
      }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        if (lines.length <= 1) return;

        const db = getDB();
        let added = 0;
        // 先頭行ヘッダー
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
          if (cols.length >= 2) {
            const nextId = db.length > 0 ? Math.max(...db.map(q => q.id)) + 1 : 1;
            db.push({
              id: nextId,
              Question: cols[1] || cols[0],
              Answer: cols[2] || '',
              Memo: cols[3] || '',
              FB: cols[4] || '',
              Contributor: cols[5] || getCurrentUser(),
              WhoAnswers: cols[6] || '',
              FBer: cols[7] || '',
              Genre: cols[8] || 'classic',
              AnswerReq: cols[9] || '',
              FBReq: cols[10] || ''
            });
            added++;
          }
        }
        saveDB(db);
        showToast(`CSVから${added}件の質問をインポートしました`);
        renderCsvDLUPView();
      };
      reader.readAsText(file, 'utf-8');
    }

    async function handlePdfUpload() {
      const fileInput = document.getElementById('pdfFileInput');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('PDFファイルを選択してください。');
        return;
      }
      const file = fileInput.files[0];
      const resultArea = document.getElementById('pdfResultArea');
      const textArea = document.getElementById('pdfExtractedText');
      const downloadBtn = document.getElementById('btnDownloadTxt');

      showToast('PDFを解析中...');

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += `--- [Page ${i}] ---\n` + pageText + '\n\n';
        }

        textArea.value = fullText;
        resultArea.style.display = 'block';

        const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8;' });
        downloadBtn.href = URL.createObjectURL(blob);
        showToast(`全 ${pdf.numPages} ページのテキスト抽出が完了しました`);
      } catch (err) {
        console.error(err);
        alert('PDFの解析に失敗しました: ' + err.message);
      }
    }

    // ==========================================
    // 画面 14: プロフィール画面 (profile.html 再現)
    // ==========================================
    function renderProfileView() {
      const app = document.getElementById('app-view');
      const currentUser = getCurrentUser();
      const accounts = getAccounts();
      const acc = accounts.find(a => a.username === currentUser) || { username: currentUser, lastName: '', firstName: '', img: 'images/upper_body.png' };

      app.innerHTML = `
        <div class="profile-container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
          <div class="profile-header" style="text-align: center;">
            <img src="${acc.img || 'images/upper_body.png'}" alt="プロフィール画像" class="icon" style="width: 140px; height: 140px; object-fit: contain; border: 3px solid #333; border-radius: 50%; background: #fff;" />
          </div>

          <h1 style="text-align: center; margin: 15px 0;">${escapeHtml(acc.username)}</h1>

          <section class="profile-two-column" style="width: 100%;">
            <div class="profile-textarea" style="border: 2px solid #333; background: #fff; padding: 15px; border-radius: 8px;">
              <dl class="profile-memo">
                <dt style="font-weight: bold; margin-bottom: 8px;">ユーザー情報</dt>
                <dd><strong>ユーザーID:</strong> ${escapeHtml(acc.username)}</dd>
                <dd><strong>パスワード:</strong> ********</dd>
                <dd><strong>苗字:</strong> ${escapeHtml(acc.lastName || '')}</dd>
                <dd><strong>名前:</strong> ${escapeHtml(acc.firstName || '')}</dd>
              </dl>
            </div>

            <div style="text-align: center; margin: 20px 0;">
              <button onclick="location.hash='#/'" class="btn-back-home">戻る</button>
            </div>

            <form style="border: 2px solid #333; padding: 15px; background: #fff; border-radius: 8px; margin-top: 15px;" onsubmit="handleProfileUpdate(event)">
              <h2 style="font-size: 20px; margin-bottom: 12px;">プロフィール変更</h2>
              <p>
                <label for="prof_last_name">苗字:</label><br>
                <input id="prof_last_name" type="text" value="${escapeHtml(acc.lastName || '')}" style="width: 100%; padding: 6px;" />
              </p>
              <p>
                <label for="prof_first_name">名前:</label><br>
                <input id="prof_first_name" type="text" value="${escapeHtml(acc.firstName || '')}" style="width: 100%; padding: 6px;" />
              </p>
              <button type="submit" style="padding: 8px 20px; font-weight: bold; cursor: pointer; margin-top: 10px;">
                変更を保存
              </button>
            </form>
          </section>
        </div>
      `;
    }

    function handleProfileUpdate(e) {
      e.preventDefault();
      const lastName = document.getElementById('prof_last_name').value.trim();
      const firstName = document.getElementById('prof_first_name').value.trim();
      const currentUser = getCurrentUser();
      const accounts = getAccounts();
      const acc = accounts.find(a => a.username === currentUser);
      if (acc) {
        acc.lastName = lastName;
        acc.firstName = firstName;
        saveAccounts(accounts);
        showToast('プロフィールを更新しました');
      }
      renderProfileView();
    }

    // ==========================================
    // 画面 15: メール・マイページ画面 (mail.html 再現)
    // ==========================================
    function renderMailView() {
      const app = document.getElementById('app-view');
      const currentUser = getCurrentUser();
      const db = getDB();

      const myPosted = db.filter(q => q.Contributor === currentUser);
      const myAnswered = db.filter(q => q.WhoAnswers === currentUser);
      const myFeedbacked = db.filter(q => q.FBer === currentUser);
      const requestedToAnswer = db.filter(q => q.AnswerReq === currentUser);
      const requestedToFB = db.filter(q => q.FBReq === currentUser);

      app.innerHTML = `
        <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
          <h2 style="text-align: center; font-size: 26px;">${escapeHtml(currentUser)} のメニュー</h2>

          <div class="chart-box" style="height: 260px; max-width: 500px; margin-bottom: 25px;">
            <canvas id="mailStatsChart"></canvas>
          </div>

          <!-- 投稿した質問 -->
          <ul class="situmonwaku" style="border: 2px solid #333; margin-bottom: 20px; padding: 0; background: #fff; list-style: none;">
            <p style="background: #e2e8f0; font-weight: bold; padding: 10px; margin: 0; border-bottom: 2px solid #333;">
              ${escapeHtml(currentUser)}の投稿した質問 (${myPosted.length}件)
            </p>
            ${myPosted.map(q => `
              <div class="mail-textarea" style="padding: 10px; border-bottom: 1px solid #ccc;">
                <a href="#/mensetu/${q.id}" style="color: #0284c7; font-weight: bold;">質問:${q.id}</a>
                <div style="font-size: 14px;">内容: ${escapeHtml(q.Question)}</div>
              </div>
            `).join('')}
          </ul>

          <!-- 回答した質問 -->
          <ul class="situmonwaku" style="border: 2px solid #333; margin-bottom: 20px; padding: 0; background: #fff; list-style: none;">
            <p style="background: #e2e8f0; font-weight: bold; padding: 10px; margin: 0; border-bottom: 2px solid #333;">
              ${escapeHtml(currentUser)}の回答した質問 (${myAnswered.length}件)
            </p>
            ${myAnswered.map(q => `
              <div class="mail-textarea" style="padding: 10px; border-bottom: 1px solid #ccc;">
                <a href="#/feedback_let/${q.id}" style="color: #0284c7; font-weight: bold;">質問:${q.id}</a>
                <div style="font-size: 14px;">回答: ${escapeHtml(q.Answer)}</div>
              </div>
            `).join('')}
          </ul>

          <!-- フィードバックリクエストが来た質問 -->
          <ul class="situmonwaku" style="border: 2px solid #333; margin-bottom: 20px; padding: 0; background: #fff; list-style: none;">
            <p style="background: #e2e8f0; font-weight: bold; padding: 10px; margin: 0; border-bottom: 2px solid #333;">
              ${escapeHtml(currentUser)}にフィードバックリクエストが来た質問 (${requestedToFB.length}件)
            </p>
            ${requestedToFB.map(q => `
              <div class="mail-textarea" style="padding: 10px; border-bottom: 1px solid #ccc;">
                <a href="#/feedback_let/${q.id}" style="color: #0284c7; font-weight: bold;">質問:${q.id}</a>
                <div style="font-size: 14px;">質問: ${escapeHtml(q.Question)}</div>
              </div>
            `).join('')}
          </ul>

          <div style="text-align: center; margin-top: 20px;">
            <button onclick="location.hash='#/'" class="btn-back-home">戻る</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const ctx = document.getElementById('mailStatsChart');
        if (ctx) {
          new Chart(ctx.getContext('2d'), {
            type: 'bar',
            data: {
              labels: ['投稿', '回答', 'FB', '回答依頼', 'FB依頼'],
              datasets: [{
                label: '件数',
                data: [myPosted.length, myAnswered.length, myFeedbacked.length, requestedToAnswer.length, requestedToFB.length],
                backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
          });
        }
      }, 50);
    }

    // ==========================================
    // 画面 16: ログイン & アカウント切替 (login.html 再現)
    // ==========================================
    function renderLoginView() {
      const app = document.getElementById('app-view');
      const accounts = getAccounts();

      app.innerHTML = `
        <div class="reg" style="max-width: 500px; margin: 20px auto; padding: 20px;">
          <h1 style="text-align: center;">ログイン画面</h1>
          <form class="loginform" style="border: 2px solid #333; padding: 20px; background: #fff; border-radius: 8px;" onsubmit="handleLoginSubmit(event)">
            <table class="reg_form" style="width: 100%; margin-bottom: 15px;">
              <tr>
                <td><label for="userid">ユーザーID:</label></td>
                <td><input type="text" id="login_userid" name="userid" style="width: 100%; padding: 6px;" value="${getCurrentUser()}" /></td>
              </tr>
              <tr>
                <td><label for="password">パスワード：</label></td>
                <td><input type="password" id="login_pass" name="password" style="width: 100%; padding: 6px;" value="123456" /></td>
              </tr>
            </table>
            <div style="text-align: center;">
              <input type="submit" class="loginbtn" value="Login" style="cursor: pointer; font-size: 16px; font-weight: bold;" />
            </div>
          </form>

          <!-- ワンクリック アカウントクイック切替 -->
          <div style="margin-top: 25px; padding: 15px; border: 1px dashed #666; background: #f8fafc; border-radius: 6px; text-align: center;">
            <p style="margin-top:0; font-weight:bold; font-size:14px;">クイックアカウント切り替え:</p>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
              ${accounts.map(a => `
                <button type="button" onclick="quickLogin('${escapeHtml(a.username)}')" style="padding: 4px 10px; font-size: 13px; cursor: pointer;">
                  ${escapeHtml(a.username)} (${escapeHtml(a.lastName || '')})
                </button>
              `).join('')}
            </div>
          </div>

          <p class="message" style="text-align: center; margin-top: 20px;">
            アカウントをお持ちですか？： <span><a href="#/signup" style="color: #0284c7;">アカウントを作成</a></span>
          </p>
          <div style="text-align: center;">
            <button onclick="location.hash='#/'" class="btn-back-home">戻る</button>
          </div>
        </div>
      `;
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('login_userid').value.trim();
      if (u) {
        setCurrentUser(u);
        showToast(`${u} としてログインしました`);
        location.hash = '#/';
      }
    }

    function quickLogin(username) {
      setCurrentUser(username);
      showToast(`${username} に切り替えました`);
      location.hash = '#/';
    }

    // ==========================================
    // 画面 17: 新規登録 (register.html 再現)
    // ==========================================
    function renderSignupView() {
      const app = document.getElementById('app-view');

      app.innerHTML = `
        <div class="reg" style="max-width: 500px; margin: 20px auto; padding: 20px;">
          <h1 style="text-align: center;">新規登録</h1>
          <form class="loginform" style="border: 2px solid #333; padding: 20px; background: #fff; border-radius: 8px;" onsubmit="handleSignupSubmit(event)">
            <table class="reg_form" style="width: 100%; margin-bottom: 15px;">
              <tr>
                <td><label for="new_userid">ユーザーID:</label></td>
                <td><input type="text" id="new_userid" required style="width: 100%; padding: 6px;" /></td>
              </tr>
              <tr>
                <td><label for="new_lastname">苗字:</label></td>
                <td><input type="text" id="new_lastname" style="width: 100%; padding: 6px;" /></td>
              </tr>
              <tr>
                <td><label for="new_firstname">名前:</label></td>
                <td><input type="text" id="new_firstname" style="width: 100%; padding: 6px;" /></td>
              </tr>
              <tr>
                <td><label for="new_password">パスワード：</label></td>
                <td><input type="password" id="new_password" style="width: 100%; padding: 6px;" value="123456" /></td>
              </tr>
            </table>
            <div style="text-align: center;">
              <input type="submit" class="loginbtn" value="登録" style="cursor: pointer; font-size: 16px; font-weight: bold;" />
            </div>
          </form>
          <div style="text-align: center; margin-top: 20px;">
            <button onclick="location.hash='#/'" class="btn-back-home">戻る</button>
          </div>
        </div>
      `;
    }

    function handleSignupSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('new_userid').value.trim();
      const last = document.getElementById('new_lastname').value.trim();
      const first = document.getElementById('new_firstname').value.trim();

      if (!u) return;

      const accounts = getAccounts();
      if (accounts.some(a => a.username === u)) {
        alert('そのユーザーIDは既に登録されています。');
        return;
      }

      accounts.push({
        username: u,
        lastName: last,
        firstName: first,
        img: 'images/upper_body.png'
      });
      saveAccounts(accounts);
      setCurrentUser(u);
      showToast(`アカウント ${u} を作成しログインしました`);
      location.hash = '#/';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 初期化リスナー
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderUser();
      router();
    });
  </script>
</body>
